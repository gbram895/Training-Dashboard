<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f9f9f7" />
    <script>
      // Applies a saved Light/Dark choice before first paint, so there's no
      // flash of the wrong theme. Mirrors lib/theme.ts's applyTheme(), kept
      // in plain JS here since it must run before any module can load.
      (function () {
        try {
          var stored = localStorage.getItem('training-dashboard.theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'system';
          if (theme !== 'system') document.documentElement.dataset.theme = theme;
          var resolved =
            theme === 'system'
              ? window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#111514' : '#f9f9f7');
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Training Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* First-paint splash, below. Inline because index.css only arrives with
         the JS bundle, and these are the same values as its --bg,
         --surface-sunken and --accent-solid tokens. */
      .boot {
        --boot-bg: #f6f7f6;
        --boot-track: #eff2f1;
        --boot-label: #0a93a8;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: var(--boot-bg);
      }
      .boot-track {
        stroke: var(--boot-track);
      }
      .boot-pulse {
        stroke-dasharray: 34.6 34.6;
        animation: boot-travel 1.6s linear infinite;
      }
      @keyframes boot-travel {
        from {
          stroke-dashoffset: 34.6;
        }
        to {
          stroke-dashoffset: -34.6;
        }
      }
      .boot-label {
        margin: 0;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--boot-label);
      }
      html[data-theme='dark'] .boot {
        --boot-bg: #111514;
        --boot-track: #212827;
        --boot-label: #3fd0c9;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) .boot {
          --boot-bg: #111514;
          --boot-track: #212827;
          --boot-label: #3fd0c9;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-pulse {
          animation: none;
          stroke-dasharray: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Shown on the very first paint, before the bundle has parsed: the same
           cadence loader the app uses, so a cold launch doesn't start on a blank
           screen. createRoot replaces all of it the moment React mounts. -->
      <div class="boot">
        <svg width="200" height="114" viewBox="-2 -2 28 16" aria-hidden="true">
          <defs>
            <linearGradient id="bootGradient" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" stop-color="#4fb6e8" />
              <stop offset="1" stop-color="#4fd8a0" />
            </linearGradient>
          </defs>
          <polyline
            class="boot-track"
            points="1,11 6,3 10,8 14,1 18,5 22,2"
            fill="none"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <polyline
            class="boot-pulse"
            points="1,11 6,3 10,8 14,1 18,5 22,2"
            fill="none"
            stroke="url(#bootGradient)"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <p class="boot-label">Loading</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
